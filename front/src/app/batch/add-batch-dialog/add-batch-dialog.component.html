<h2 mat-dialog-title>Enter Batch Info</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-full mb-4">
      <mat-label>Production Date</mat-label>
      <input matInput [matDatepicker]="prodPicker" formControlName="productionDate" />
      <mat-datepicker-toggle matSuffix [for]="prodPicker"></mat-datepicker-toggle>
      <mat-datepicker #prodPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full mb-4">
      <mat-label>Expiration Date</mat-label>
      <input matInput [matDatepicker]="expPicker" formControlName="expirationDate" />
      <mat-datepicker-toggle matSuffix [for]="expPicker"></mat-datepicker-toggle>
      <mat-datepicker #expPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full mb-4">
      <mat-label>Number of Sauces</mat-label>
      <input matInput type="number" formControlName="quantity" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full mb-4">
      <mat-label>Sauce Number</mat-label>
      <input matInput type="text" formControlName="sauceNumber" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full mb-4">
      <mat-label>Order Number</mat-label>
      <input matInput type="text" formControlName="orderNumber" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Submit</button>
  </mat-dialog-actions>
</form>
