<header>
  <span id="logo">
    <img routerLink="/" *ngIf="DarkLightBtnComponent.lightMode" src="/assets/logo/black.png" alt="Pan Sauce logo">
    <img routerLink="/" *ngIf="!DarkLightBtnComponent.lightMode" src="/assets/logo/white.png" alt="Pan Sauce logo">
  </span>
  <span id="navigation">
    <ng-container *ngIf="authService.isLoggedIn(); else Blank">
      <button *ngFor="let page of pages"
              class="text-btn"
              [routerLink] = page
              routerLinkActive="active">
        {{ page | titlecase }}
      </button>
    </ng-container>
    <ng-template #Blank><p>PAN SAUCE. Bringing back that taste of your youth~</p>></ng-template>
  </span>
  <span id="settings">
    <app-dark-light-btn/>
    <app-login-logout-btn/>
  </span>
</header>
