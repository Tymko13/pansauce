<header>
  <span id="logo">
    <img *ngIf="DarkLightBtnComponent.lightMode" src="/assets/logo/black.png" alt="Pan Sauce logo">
    <img *ngIf="!DarkLightBtnComponent.lightMode" src="/assets/logo/white.png" alt="Pan Sauce logo">
  </span>
  <span id="navigation">
    <button class="text-btn">Home</button>
    <button class="text-btn">Products</button>
    <button class="text-btn">Orders</button>
    <button class="text-btn">Info</button>
  </span>
  <span id="settings">
    <app-dark-light-btn/>
    <button class="icon-btn" id="login" routerLink="/login">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" height="24px" width="24px">
        <path d="M11,7L9.6,8.4l2.6,2.6H2v2h10.2l-2.6,2.6L11,17l5-5L11,7z M20,19h-8v2h8c1.1,0,2-0.9,2-2V5c0-1.1-0.9-2-2-2h-8v2h8V19z" fill="currentColor"/>
      </svg> Login
    </button>
  </span>
</header>
