<h2 mat-dialog-title>Edit Order Info</h2>

<form [formGroup]="form()" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Expected Date</mat-label>
      <input matInput [matDatepicker]="expPicker" formControlName="expectedDate" />
      <mat-datepicker-toggle matSuffix [for]="expPicker"></mat-datepicker-toggle>
      <mat-datepicker #expPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Real Date</mat-label>
      <input matInput [matDatepicker]="realPicker" formControlName="realDate" />
      <mat-datepicker-toggle matSuffix [for]="realPicker"></mat-datepicker-toggle>
      <mat-datepicker #realPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Delivery Cost</mat-label>
      <input matInput type="number" step="0.01" min="0.01" formControlName="deliveryCost" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form().invalid">Submit</button>
  </mat-dialog-actions>
</form>
