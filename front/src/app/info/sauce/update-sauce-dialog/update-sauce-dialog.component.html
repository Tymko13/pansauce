<h2 mat-dialog-title>Edit Sauce Info</h2>

<form [formGroup]="form()" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput type="text" formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Weight</mat-label>
      <input matInput type="number" step="0.01" formControlName="weight" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Cost</mat-label>
      <input matInput type="number" step="0.01" formControlName="cost" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Shelf Life</mat-label>
      <input matInput type="number" step="1" formControlName="shelfLife" />
    </mat-form-field>

    <mat-form-field id="types" appearance="outline">
      <mat-select formControlName="typeNumber">
        <mat-option *ngFor="let type of types"
          [value]="type.typeNumber">
          {{type.typeName}} <br> {{type.typeNumber}}
        </mat-option>
      </mat-select>
    </mat-form-field>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form().invalid">Submit</button>
  </mat-dialog-actions>
  </mat-dialog-content>
</form>
