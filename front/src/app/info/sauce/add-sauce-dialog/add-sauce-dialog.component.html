<h2 mat-dialog-title>Enter Sauce Info</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field class="left" appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput type="text" formControlName="name" placeholder="Enter sauce name..." />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Weight</mat-label>
      <input matInput type="number" [step]="0.01" formControlName="weight" />
    </mat-form-field>

    <mat-form-field class="left" appearance="outline">
      <mat-label>Cost</mat-label>
      <input matInput type="number" [step]="0.01" formControlName="cost" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Shelf Life</mat-label>
      <input matInput type="number"  [step]="1" formControlName="shelfLife" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Type</mat-label>

      <ng-container *ngIf="!isNewType; else newType">
        <mat-select formControlName="typeNumber">
          <mat-option *ngFor="let type of types" [value]="type.typeNumber">
            {{ type.typeName }}
          </mat-option>
        </mat-select>
      </ng-container>

      <ng-template #newType>
        <input matInput type="text" formControlName="typeName" placeholder="Enter custom type"/>
      </ng-template>
    </mat-form-field>

    <button id="type" mat-raised-button (click)="toggleType()">
      {{ isNewType ? 'Choose from list' : 'Enter new type' }}
    </button>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Proceed</button>
  </mat-dialog-actions>
</form>
