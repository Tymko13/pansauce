<h2 mat-dialog-title>Edit Batch Info</h2>

<form [formGroup]="form()" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Sauce Cost</mat-label>
      <input matInput type="number" step="0.01" formControlName="sauceCost" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Number of Sauces</mat-label>
      <input matInput type="number" formControlName="quantity" />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form().invalid">Submit</button>
  </mat-dialog-actions>
</form>
