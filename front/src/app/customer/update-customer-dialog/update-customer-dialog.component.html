<h2 mat-dialog-title>Edit Customer Info</h2>

<form [formGroup]="form()" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field class="name" appearance="outline">
      <mat-label>First Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field class="name"  appearance="outline">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="surname" />
    </mat-form-field>

    <mat-form-field class="name"  appearance="outline">
        <mat-label>Patronymic</mat-label>
        <input matInput formControlName="patronymic" />
    </mat-form-field>

    <mat-form-field class="address" appearance="outline">
        <mat-label>Address</mat-label>
        <input matInput formControlName="address" />
    </mat-form-field>

    <mat-form-field class="phones" appearance="outline">
      <mat-label>Phone Numbers</mat-label>
      <mat-chip-grid #phonesChipGrid formControlName="phones">
        <mat-chip-row *ngFor="let phone of phones()"
        (removed)="removePhone(phone)"
        [removable]="true">
          {{phone}}
          <button matChipRemove><mat-icon>cancel</mat-icon></button>
        </mat-chip-row>
      </mat-chip-grid>
      <input
        placeholder="New phone number..."
        [matChipInputFor]="phonesChipGrid"
        (matChipInputTokenEnd)="addPhone($event.value); $event.chipInput.clear()"/>
      <mat-hint>+380123456789</mat-hint>
    </mat-form-field>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form().invalid">Submit</button>
  </mat-dialog-actions>
</form>
