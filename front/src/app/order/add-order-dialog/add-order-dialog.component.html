<h2 mat-dialog-title>Enter Batch Info</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Production Date</mat-label>
      <input matInput [matDatepicker]="prodPicker" formControlName="productionDate" />
      <mat-datepicker-toggle matSuffix [for]="prodPicker"></mat-datepicker-toggle>
      <mat-datepicker #prodPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Expiration Date</mat-label>
      <input matInput [matDatepicker]="expPicker" formControlName="expirationDate" />
      <mat-datepicker-toggle matSuffix [for]="expPicker"></mat-datepicker-toggle>
      <mat-datepicker #expPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Sauce</mat-label>
      <mat-select formControlName="sauceNumber">
        <mat-option *ngFor="let sauce of sauces" [value]="sauce.number">
          {{sauce.name}}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Number of Sauces</mat-label>
      <input matInput type="number" formControlName="quantity" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Order</mat-label>
      <mat-select [canSelectNullableOptions]="true" formControlName="orderNumber">
        <mat-option [value]="null">-</mat-option>
        <mat-option *ngFor="let order of orders" [value]="order.number">
          {{order.number}}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Submit</button>
  </mat-dialog-actions>
</form>
